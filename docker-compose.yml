services:
  postgres:
    image: postgres:16-alpine
    container_name: new-raj-fashion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rajfashion
      POSTGRES_PASSWORD: rajfashion_dev
      POSTGRES_DB: new_raj_fashion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rajfashion -d new_raj_fashion"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: rustfs/rustfs:1.0.0
    container_name: new-raj-fashion-s3
    command: /data
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0..3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rajfashiondev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rajfashion-local-secret-2026}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - object_storage_0:/data/rustfs0
      - object_storage_1:/data/rustfs1
      - object_storage_2:/data/rustfs2
      - object_storage_3:/data/rustfs3
    restart: unless-stopped

volumes:
  postgres_data:
  object_storage_0:
  object_storage_1:
  object_storage_2:
  object_storage_3:
